:root{--bg:#f4f7f1;--card:#fff;--tx:#1d2a1f;--mu:#5d6b5f;--ac:#2e8b3d;--bd:#d9e2d6}

*{box-sizing:border-box}html,body{margin:0}

function amigos(){return lista("friends","Amigos y redes","Nombre","Enlace (Instagram, web...)","Añadir","Añadir amigo")}

function sitios(){

  return `<h2>Avistamientos</h2>`+(l.map(f=>{const u=safe(f.url),sub=[fmtF(f.fecha),f.nota].filter(Boolean).join(" · ");return `<div class="card"><b>${esc(f.name)}</b><button class="x" onclick="rm('sights',${f.i})">🗑</button>${sub?`<br><small class="mu">${esc(sub)}</small>`:""}${u?`<a class="b" href="${esc(u)}" target="_blank">📍 Abrir mapa</a>`:""}</div>`}).join("")||`<p class="mu">Aún no hay localizaciones.</p>`)+
  `<form class="card" onsubmit="add('sights',this);return false"><b>Nueva localización</b><input name="name" placeholder="Especie"><input name="url" placeholder="Enlace del lugar (Google Maps...)"><input name="fecha" type="date" value="${new Date().toISOString().slice(0,10)}"><input name="nota" placeholder="Nota (macho en el carrizal...)"><button class="b">Guardar</button></form>`;
}
function vistas(){
  const l=S.seen.map((f,i)=>({...f,i})).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const esp=new Set(S.seen.map(x=>x.name.toLowerCase())).size;
  const nombres=[...new Set(LIB.map(b=>b.name))].sort((a,b)=>a.localeCompare(b,"es"));
  return `<h2>Mis aves vistas</h2><div class="card" style="text-align:center"><div class="big">${esp}</div>${esp===1?"especie":"especies"} · ${S.seen.length} ${S.seen.length===1?"avistamiento":"avistamientos"}</div>`+
  `<form class="card" onsubmit="add('seen',this);return false"><b>Añadir ave vista</b><input name="name" list="dl" placeholder="Especie"><datalist id="dl">${nombres.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><input name="fecha" type="date" value="${new Date().toISOString().slice(0,10)}"><input name="lugar" placeholder="Lugar"><input type="hidden" name="lat"><input type="hidden" name="lon"><button type="button" class="b" style="background:var(--mu)" onclick="gpsForm(this)">📍 Añadir mi ubicación</button><button class="b">Añadir</button></form>`+
  (l.map(f=>`<div class="card"><b>${esc(f.name)}</b><button class="x" onclick="rm('seen',${f.i})">🗑</button><br><small class="mu">${esc([fmtF(f.fecha),f.lugar].filter(Boolean).join(" · "))}</small><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="chip" style="margin-top:8px;padding:6px 14px" onclick="compV(${f.i})">📤 Compartir</button>${f.lat&&f.lon?`<button class="chip" style="margin-top:8px;padding:6px 14px" onclick="go('https://www.google.com/maps?q=${esc(f.lat)},${esc(f.lon)}')">📍 Abrir mapa</button>`:""}</div></div>`).join("")||`<p class="mu">Todavía no has anotado ninguna.</p>`);
}
let R={w:null,ready:false,load:0,err:"",on:false,busy:false,stream:null,ctx:null,buf:null,n:0,timer:null,hist:[],top:[]};
const RURL=f=>new URL(f,location.href).href;
function iniciarW(){
  if(R.w||R.err)return;
  try{
    const p=new URLSearchParams({tf:RURL("js/tf.min.js"),root:RURL("models"),lang:"es"});
    R.w=new Worker(RURL("js/birdnet-worker.js")+"?"+p.toString());
  }catch(e){R.err="Este móvil no puede iniciar el reconocimiento de aves.";return}
  R.w.onmessage=ev=>{
    const d=ev.data||{};
    if(typeof d.progress==="number")R.load=d.progress;
    if(d.message==="loaded"){R.ready=true;R.w.postMessage({message:"area-scores",latitude:37.26,longitude:-6.94})}
    if(d.message==="pooled"){R.busy=false;procesaR(d.pooled)}
    pintaR();
  };
  R.w.onerror=()=>{R.err="No se pudo cargar el modelo de reconocimiento.";R.w=null;pintaR()};
}
function procesaR(pooled){
  const m={};
  pooled.forEach(x=>{if(typeof x.geoscore==="number"&&x.geoscore<0.05)return;if(x.confidence<0.1)return;m[x.scientificName]={name:x.commonNameI18n||x.commonName,sci:x.scientificName,c:x.confidence}});
  R.hist.push(m);if(R.hist.length>5)R.hist.shift();
  const all={};
  R.hist.forEach(h=>Object.values(h).forEach(x=>{if(!all[x.sci]||all[x.sci].c<x.c)all[x.sci]=x}));
  R.top=Object.values(all).sort((a,b)=>b.c-a.c).slice(0,5);
}
function barraR(){
  if(R.err)return `<p class="mu">${R.err}</p>`;
  if(!R.ready)return `<p class="mu">Cargando el modelo de reconocimiento... ${Math.round(R.load)}%<br><small>La primera vez tarda unos segundos.</small></p>`;
  return R.on?`<p class="mu">🎧 Escuchando... acerca el móvil al canto.</p>`:`<p class="mu">Listo. Pulsa el botón y deja que suene el ave.</p>`;
}
function listaR(){
  if(!R.top.length)return R.on?`<div class="card mu">Todavía no he reconocido ningún ave...</div>`:"";
  return R.top.map((x,i)=>`<div class="card"><b>${esc(x.name)}</b> <span class="mu">${Math.round(x.c*100)}%</span><div class="sci">${esc(x.sci)}</div><div class="bar"><div style="width:${Math.min(100,Math.round(x.c*100))}%"></div></div><button class="b" onclick="anotaR(${i})">✅ Anotar en el calendario</button></div>`).join("");
}
function pintaR(){
  if(tab!=="reconocer")return;
  const a=document.getElementById("rs"),b=document.getElementById("rb"),c=document.getElementById("rl");
  if(a)a.innerHTML=barraR();if(c)c.innerHTML=listaR();
  if(b){b.disabled=!R.ready;b.textContent=R.on?"⏹ Detener":"🎤 Escuchar"}
}
window.anotaR=async i=>{const x=R.top[i];if(!x)return;const e={name:x.name,fecha:new Date().toISOString().slice(0,10),lugar:""};S.seen.push(e);keep();toast("Añadida: "+x.name);const g=await getPos();if(g){e.lat=g.lat;e.lon=g.lon;keep()}};
window.toggleR=async()=>{if(R.on){detenerR();pintaR();return}await escucharR();pintaR()};
async function escucharR(){
  if(!R.ready)return;
  try{
    R.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    R.ctx=new AudioContext({sampleRate:48000});
    if(R.ctx.state==="suspended")await R.ctx.resume();
    const src=R.ctx.createMediaStreamSource(R.stream),hp=R.ctx.createBiquadFilter();
    hp.type="highpass";hp.frequency.value=120;
    const pr=R.ctx.createScriptProcessor(4096,1,1);
    R.buf=new Float32Array(144000);R.n=0;R.hist=[];R.top=[];R.busy=false;
    pr.onaudioprocess=e=>{const d=e.inputBuffer.getChannelData(0);R.buf.copyWithin(0,d.length);R.buf.set(d,144000-d.length);R.n+=d.length};
    src.connect(hp);hp.connect(pr);pr.connect(R.ctx.destination);R.pr=pr;
    R.on=true;
    R.timer=setInterval(()=>{
      if(!R.on||R.busy||R.n<144000||!R.w)return;
      R.busy=true;const w=new Float32Array(R.buf);
      R.w.postMessage({message:"predict",pcmAudio:w,overlapSec:0,sensitivity:1.0},[w.buffer]);
    },1500);
  }catch(e){R.on=false;R.err="";toast("No puedo usar el micrófono. Revisa el permiso de la app.")}
}
function detenerR(){
  R.on=false;clearInterval(R.timer);
  try{if(R.pr)R.pr.disconnect()}catch(e){}
  try{if(R.stream)R.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{if(R.ctx)R.ctx.close()}catch(e){}
  R.stream=null;R.ctx=null;R.pr=null;R.busy=false;
}
function reconocer(){
  iniciarW();
  return `<h2>Reconocer ave</h2><div id="rs">${barraR()}</div><button class="b" id="rb" onclick="toggleR()" ${R.ready?"":"disabled"}>${R.on?"⏹ Detener":"🎤 Escuchar"}</button><div id="rl">${listaR()}</div><small class="mu">Reconocimiento con BirdNET (Cornell Lab of Ornithology y Universidad Técnica de Chemnitz). Modelo con licencia CC BY-SA 4.0. Es orientativo: con ruido o varias aves a la vez puede fallar.</small>`;
}
let Q={cur:null,opts:[],ans:null,ok:0,tot:0,play:false};
const uniq=()=>{const m={};LIB.forEach(b=>{m[b.name.toLowerCase()]=b});return Object.values(m)};
function nuevaQ(){const u=uniq(),cur=u[Math.floor(Math.random()*u.length)];Q.cur=cur;Q.opts=[cur,...u.filter(b=>b!==cur).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);Q.ans=null}
function qopts(){return Q.opts.map((b,i)=>{let c="b";if(Q.ans!==null){if(b===Q.cur)c+=" okq";else if(b===Q.ans)c+=" malq"}return `<button class="${c}" ${Q.ans!==null?"disabled":""} onclick="respQ(${i})">${esc(b.name)}</button>`}).join("")+(Q.ans!==null?`<div class="card"><b>${Q.ans===Q.cur?"✅ ¡Correcto!":"❌ Era: "+esc(Q.cur.name)}</b><div class="sci">${esc(Q.cur.sci)}</div></div><button class="b" onclick="sigQ()">Siguiente ▶</button>`:"")}
window.respQ=i=>{if(Q.ans!==null)return;Q.ans=Q.opts[i];Q.tot++;if(Q.ans===Q.cur)Q.ok++;$("#qo").innerHTML=qopts();$("#qs").textContent=Q.ok+" / "+Q.tot};
window.sigQ=()=>{nuevaQ();Q.play=true;render()};
function quiz(){
  const u=uniq();
  if(u.length<4)return `<h2>Quiz de sonidos</h2><div class="card">Necesito al menos 4 aves distintas con audio. Entra en Sonidos de aves y carga tu carpeta SONIDOS AVES.</div>`;
  if(!Q.cur||!u.includes(Q.cur)){nuevaQ();Q.play=true}
  return `<h2>¿Qué ave canta?</h2><p class="mu">Aciertos: <b id="qs">${Q.ok} / ${Q.tot}</b></p><div class="card"><audio id="qa" controls src="${au(Q.cur)}"></audio></div><div id="qo">${qopts()}</div><button class="b" style="background:var(--mu)" onclick="Q.ok=0;Q.tot=0;sigQ()">Reiniciar</button>`;
}
let tloc=null;try{tloc=JSON.parse(localStorage.getItem("ph_loc"))}catch(e){}
if(!tloc)tloc={name:"Huelva",lat:37.2614,lon:-6.9447,zona:"Andalucía"};
let tdata=null,tres=[],tmsg="",tbusy=false,tq="";
const DOWC=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],MESC=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const ARW=["↑","↗","→","↘","↓","↙","←","↖"];
function WI(c,d){if(c===0)return d?"☀️":"🌙";if(c===1)return d?"🌤️":"🌙";if(c===2)return d?"⛅":"☁️";if(c===3)return"☁️";if(c===45||c===48)return"🌫️";if(c>=51&&c<=57)return"🌦️";if(c>=61&&c<=67)return"🌧️";if(c>=71&&c<=77||c===85||c===86)return"🌨️";if(c===80||c===81)return"🌦️";if(c===82)return"🌧️";if(c>=95)return"⛈️";return"☁️"}
const nf=x=>String(Math.round(x*10)/10).replace(".",",");
window.buscarT=async()=>{const v=$("#tq").value.trim();tq=v;if(!v)return;tmsg="Buscando...";tres=[];render();
  try{const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=es&name="+encodeURIComponent(v));const j=await r.json();tres=j.results||[];tmsg=tres.length?"":"No he encontrado esa localidad."}catch(e){tmsg="No he podido buscar. Comprueba tu conexión."}render()};
window.elegirT=i=>{const x=tres[i];tloc={name:x.name,lat:x.latitude,lon:x.longitude,zona:[x.admin2,x.admin1].filter(Boolean).join(", ")};try{localStorage.setItem("ph_loc",JSON.stringify(tloc))}catch(e){}tres=[];tq="";tdata=null;cargaT()};
async function cargaT(){tbusy=true;tmsg="Cargando...";render();
  try{const u="https://api.open-meteo.com/v1/forecast?latitude="+tloc.lat+"&longitude="+tloc.lon+"&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset&timezone=auto&forecast_days=7";
    const r=await fetch(u);tdata=await r.json();if(!tdata.daily)throw 0;tmsg=""}catch(e){tdata=null;tmsg="No he podido cargar el tiempo. Comprueba tu conexión."}
  tbusy=false;render()}
window.cargaT=cargaT;
function tiempo(){
  if(!tdata&&!tbusy&&!tmsg)cargaT();
  const res=tres.map((x,i)=>`<div class="card" onclick="elegirT(${i})"><b>${esc(x.name)}</b><br><small class="mu">${esc([x.admin2,x.admin1,x.country].filter(Boolean).join(", "))}</small></div>`).join("");
  let tab_="";
  if(tdata){const D=tdata.daily,H=tdata.hourly,n=D.time.length;const R=[];
    const row=(l,f)=>`<tr><td class="l">${l}</td>${D.time.map((_,i)=>`<td>${f(i)}</td>`).join("")}</tr>`;
    const hr=(h)=>(i)=>{const k=i*24+h;return `<div class="ic">${WI(H.weather_code[k],H.is_day[k])}</div>${Math.round(H.temperature_2m[k])}º`};

window.cbGuardar=async()=>{
  const hoy=new Date().toISOString().slice(0,10),nombre="pajareo-huelva-copia-"+hoy+".json";
  const txt=JSON.stringify({app:"pajareo-huelva",version:1,fecha:hoy,datos:cbDatos()});
  const P=window.Capacitor&&window.Capacitor.Plugins;
  try{
    if(P&&P.Filesystem&&P.Share){
      const r=await P.Filesystem.writeFile({path:nombre,data:txt,directory:"CACHE",encoding:"utf8"});
      await P.Share.share({title:"Copia de Pajareo Huelva",text:"Copia de seguridad de Pajareo Huelva",url:r.uri,dialogTitle:"Guarda la copia (Drive, Telegram, Archivos…)"});
      CB.msg="Copia creada. Guárdala en un sitio seguro (Drive, Telegram, tu ordenador…).";
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=nombre;document.body.appendChild(a);a.click();a.remove();
      CB.msg="Copia descargada: "+nombre;
    }
  }catch(e){
    if(String(e&&e.message||e).toLowerCase().includes("cancel"))CB.msg="";else CB.msg="No se pudo crear la copia: "+(e&&e.message||e);
  }
  render();
};
window.cbRestaurar=async file=>{
  if(!file)return;
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.app!=="pajareo-huelva"||!j.datos||typeof j.datos!=="object")throw new Error("Este archivo no es una copia de Pajareo Huelva.");
    const ks=Object.keys(j.datos).filter(k=>k.startsWith("ph"));
    if(!ks.length)throw new Error("La copia está vacía.");
    if(!confirm("Se sustituirán tus datos actuales (aves anotadas, localizaciones, amigos, teléfonos, orden del menú…) por los de la copia del "+(j.fecha||"?")+". ¿Continuar?"))return;
    for(const k of ks)localStorage.setItem(k,String(j.datos[k]));
    alert("Copia restaurada. La app se va a reiniciar.");location.reload();
  }catch(e){CB.msg="No se pudo restaurar: "+(e&&e.message||e);render()}
};
function copia(){
  const d=cbDatos(),n=(()=>{try{const x=JSON.parse(d.ph||"{}");return{v:(x.seen||[]).length,l:(x.sights||[]).length,a:(x.friends||[]).length,t:(x.tels||[]).length}}catch(e){return{v:0,l:0,a:0,t:0}}})();
  return `<h2>Copia de seguridad</h2>
  <div class="card">Ahora mismo tienes guardado: <b>${n.v}</b> aves anotadas, <b>${n.l}</b> localizaciones, <b>${n.a}</b> amigos y <b>${n.t}</b> teléfonos, además de tu orden del menú y tu localidad del tiempo.</div>
  <button class="b" onclick="cbGuardar()">💾 Guardar copia</button>
  <small class="mu">Crea un archivo que puedes mandarte por Telegram, guardar en Drive o pasar al ordenador.</small>
  <input type="file" id="cbf" accept="*/*" style="display:none" onchange="cbRestaurar(this.files[0]);this.value=''">
  <button class="b" style="background:var(--mu);margin-top:12px" onclick="$('#cbf').click()">📂 Restaurar copia</button>
  <small class="mu">Elige un archivo de copia guardado antes. Sustituye los datos actuales.</small>
  <div class="mu" style="margin:10px 0">${esc(CB.msg)}</div>
  <div class="card"><small class="mu"><b>Ojo:</b> los audios de Sonidos de aves no van en la copia (pesan demasiado). Si reinstalas la app, vuelve a cargar la carpeta SONIDOS AVES.</small></div>`;
}

window.compV=async i=>{
  const f=S.seen[i];if(!f)return;
  const txt="🐦 "+f.name+"\n"+[f.fecha?"📅 "+fmtF(f.fecha):"",f.lugar?"📍 "+f.lugar:"",f.lat&&f.lon?"https://www.google.com/maps?q="+f.lat+","+f.lon:""].filter(Boolean).join("\n")+"\n— Pajareo Huelva";
  const P=window.Capacitor&&window.Capacitor.Plugins;
  try{
    if(P&&P.Share)await P.Share.share({title:f.name,text:txt,dialogTitle:"Compartir avistamiento"});
    else if(navigator.share)await navigator.share({title:f.name,text:txt});
    else{await navigator.clipboard.writeText(txt);toast("Texto copiado")}
  }catch(e){if(!String(e&&e.message||e).toLowerCase().includes("cancel")){try{await navigator.clipboard.writeText(txt);toast("Texto copiado")}catch(_){toast("No se pudo compartir")}}}
};

/* ===== Ubicación GPS ===== */
let GPSERR=0;
function getPos(ms){return new Promise(res=>{
  if(!navigator.geolocation){GPSERR=-1;return res(null)}
  const ok=p=>res({lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5)});
  const intenta=(alta,t,fallo)=>{try{navigator.geolocation.getCurrentPosition(ok,e=>{GPSERR=e&&e.code||2;fallo()},{enableHighAccuracy:alta,timeout:t,maximumAge:120000})}catch(e){GPSERR=2;fallo()}};
  /* 1º ubicación rápida (red/wifi); si falla, GPS preciso con más tiempo */
  intenta(false,8000,()=>{if(GPSERR===1)return res(null);intenta(true,20000,()=>res(null))});
})}
window.gpsForm=async b=>{const f=b.closest("form");b.textContent="📍 Buscando ubicación…";const g=await getPos(10000);
  if(g){f.querySelector("[name=lat]").value=g.lat;f.querySelector("[name=lon]").value=g.lon;b.textContent="✔ Ubicación guardada ("+g.lat+", "+g.lon+")"}
  else b.textContent=GPSERR===1?"📍 Sin permiso de ubicación. Actívalo en Ajustes del móvil → Apps → Pajareo Huelva → Permisos → Ubicación. Reintentar":GPSERR===3?"📍 Tarda demasiado (¿estás dentro de un edificio?). Reintentar":"📍 No se pudo: activa la ubicación del móvil. Reintentar"};

/* ===== Aves de la zona según la época ===== */
const MESN=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const ZN={mes:new Date().getMonth()+1,lista:null,busy:false,msg:"",solo:false};
async function zonaCarga(){
  if(ZN.busy)return;ZN.busy=true;ZN.msg="Cargando datos de la zona (la primera vez tarda unos segundos)…";render();
  const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error("Falta el archivo "+u);return r.arrayBuffer()};
  const ok=await FOTO.initLite({base:RURL("models/foto/"),get});
  ZN.busy=false;
  if(!ok){ZN.msg="No se pudieron cargar los datos: "+FOTO.err;render();return}
  ZN.msg="";zonaCalc();render();
}
function zonaCalc(){ZN.lista=FOTO.mes({lat:tloc.lat,lon:tloc.lon},ZN.mes,120)}
window.zonaMes=m=>{ZN.mes=m;if(FOTO.occ)zonaCalc();render()};
const nz=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
function zona(){
  if(!FOTO.occ&&!ZN.busy&&!ZN.msg)zonaCarga();
  if(FOTO.occ&&!ZN.lista)zonaCalc();
  const vistas=new Set(S.seen.map(x=>nz(x.name)));
  const chips=MESN.map((m,i)=>`<button class="chip ${ZN.mes===i+1?"on":""}" onclick="zonaMes(${i+1})">${m.slice(0,3)}</button>`).join("");
  let body="";
  if(ZN.lista){
    const max=ZN.lista[0]?ZN.lista[0].p:1;
    const rows=ZN.lista.map(x=>{const n=FOTO.nombre(x.idx),nom=n.es||n.en,v=vistas.has(nz(n.es))||vistas.has(nz(n.en));return{x,n,nom,v}}).filter(r=>!ZN.solo||!r.v);
    body=rows.map(r=>`<div class="card" style="padding:8px 12px"><b>${esc(r.nom)}</b> ${r.v?"✅":""}<div class="sci">${esc(r.n.sci)}</div><div class="bar"><div style="width:${Math.round(r.x.p/max*100)}%"></div></div></div>`).join("")||'<p class="mu">¡Las has visto todas!</p>';
  }
  return `<h2>Aves de la zona</h2><p class="mu" style="margin:2px 0 8px">Las más probables en <b>${esc(tloc.name)}</b> en <b>${MESN[ZN.mes-1]}</b>. ✅ = ya la has anotado en el calendario.</p>
  <div class="chips" style="margin-bottom:8px">${chips}</div>
  <label style="display:block;margin:4px 0"><input type="checkbox" style="width:auto" ${ZN.solo?"checked":""} onchange="ZN.solo=this.checked;render()"> Ocultar las que ya he visto</label>
  <div class="mu" style="margin:6px 0">${esc(ZN.msg)}</div>${body}
  <small class="mu" style="display:block;margin-top:10px">La zona es la localidad elegida en "El tiempo". Datos de presencia de WingDex (observaciones de aves en cuadrículas de unos 27 km). Orientativo.</small>`;
}

/* ===== Fases de la luna ===== */
const LUNA=["Luna nueva","Creciente","Cuarto creciente","Gibosa creciente","Luna llena","Gibosa menguante","Cuarto menguante","Menguante"],LEMO=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
function luna(y,m,d){const jd=Date.UTC(y,m,d,12)/86400000+2440587.5,age=(((jd-2451550.1)/29.530588853)%1+1)%1;return{i:Math.round(age*8)%8,ilu:Math.round((1-Math.cos(2*Math.PI*age))/2*100)}}

/* ===== Calendario de avistamientos ===== */
const CAL={y:new Date().getFullYear(),m:new Date().getMonth(),sel:null};
window.calMes=d=>{CAL.m+=d;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}CAL.sel=null;render()};
window.calDia=k=>{CAL.sel=CAL.sel===k?null:k;render()};
function calendario(){
  const pad=n=>String(n).padStart(2,"0"),key=d=>CAL.y+"-"+pad(CAL.m+1)+"-"+pad(d);
  const por={};S.seen.forEach((f,i)=>{if(f.fecha)(por[f.fecha]=por[f.fecha]||[]).push({...f,i})});
  const first=(new Date(CAL.y,CAL.m,1).getDay()+6)%7,nd=new Date(CAL.y,CAL.m+1,0).getDate(),hoy=new Date().toISOString().slice(0,10);
  let cells=["L","M","X","J","V","S","D"].map(x=>`<div class="mu" style="text-align:center;font-size:12px">${x}</div>`).join("")+"<div></div>".repeat(first);
  for(let d=1;d<=nd;d++){const k=key(d),n=(por[k]||[]).length,sel=CAL.sel===k;
    cells+=`<button onclick="calDia('${k}')" style="border:${k===hoy?"2px solid var(--ac)":"1px solid var(--bd)"};border-radius:10px;padding:8px 0;font:inherit;background:${sel?"var(--ac)":n?"#2e8b3d33":"var(--card)"};color:${sel?"#fff":"var(--tx)"}">${d}<div style="font-size:15px;line-height:1.1">${LEMO[luna(CAL.y,CAL.m,d).i]}</div>${n?`<div style="font-size:11px;line-height:1">🐦${n}</div>`:""}</button>`}
  const delMes=S.seen.filter(f=>f.fecha&&f.fecha.startsWith(CAL.y+"-"+pad(CAL.m+1)));
  const esp=new Set(delMes.map(f=>nz(f.name))).size;
  const lista=CAL.sel?`<h3 style="margin:14px 0 4px">${fmtF(CAL.sel)}</h3><p class="mu" style="margin:0 0 6px">${(()=>{const q=CAL.sel.split("-"),l=luna(+q[0],+q[1]-1,+q[2]);return LEMO[l.i]+" "+LUNA[l.i]+" · "+l.ilu+"% iluminada"})()}</p>`+((por[CAL.sel]||[]).map(f=>`<div class="card"><b>${esc(f.name)}</b><br><small class="mu">${esc(f.lugar||"")}</small>${f.lat&&f.lon?`<div><button class="chip" style="margin-top:6px;padding:6px 14px" onclick="go('https://www.google.com/maps?q=${esc(f.lat)},${esc(f.lon)}')">📍 Abrir mapa</button></div>`:""}</div>`).join("")||'<p class="mu">Ese día no anotaste ninguna ave.</p>'):"";
  return `<h2>Calendario</h2><div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0"><button class="chip" style="font-size:20px;padding:6px 16px" onclick="calMes(-1)">‹</button><b>${MESN[CAL.m]} ${CAL.y}</b><button class="chip" style="font-size:20px;padding:6px 16px" onclick="calMes(1)">›</button></div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
  <p class="mu" style="margin:8px 2px;font-size:13px">🌑 nueva · 🌓 cuarto creciente · 🌕 llena · 🌗 cuarto menguante</p><p class="mu" style="margin:10px 2px">Anota aves desde «Reconocer ave» o «Reconocer por foto».</p><p class="mu" style="margin:10px 2px">Este mes: <b>${delMes.length}</b> ${delMes.length===1?"avistamiento":"avistamientos"} · <b>${esp}</b> ${esp===1?"especie":"especies"}</p>${lista}`;
}

/* ===== Actualizaciones (desde GitHub Releases) ===== */
const BUILD="__BUILD__",REPO="jolunepa/Pajareo-Huelva",UP={nuevo:null};
async function buscaAct(manual){
  if(BUILD.charAt(0)==="_"){if(manual)toast("Versión de pruebas: no se puede comprobar");return}
  try{
    const r=await fetch("https://api.github.com/repos/"+REPO+"/releases/latest");if(!r.ok)throw new Error("http "+r.status);
    const j=await r.json(),n=parseInt(String(j.tag_name||"").replace(/\D/g,"")),a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(n>parseInt(BUILD)&&a){UP.nuevo={v:(j.name||j.tag_name).replace(/^Pajareo Huelva\s*/,""),url:a.browser_download_url};if(tab==="home")render();else if(manual)toast("Hay versión nueva: mira en el menú principal")}
    else if(manual)toast("Ya tienes la última versión")
  }catch(e){if(manual)toast("No se pudo comprobar (¿tienes internet?)")}
}
window.buscaAct=buscaAct;
window.instalaAct=()=>{if(UP.nuevo)go(UP.nuevo.url)};
setTimeout(()=>buscaAct(false),3000);

loadLib();
