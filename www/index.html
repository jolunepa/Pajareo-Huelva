<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pajareo Huelva</title>
<style>
:root{--bg:#f4f7f1;--card:#fff;--tx:#1d2a1f;--mu:#5d6b5f;--ac:#2f7d4a;--bd:#d9e2d6}
@media(prefers-color-scheme:dark){:root{--bg:#121a14;--card:#1c271f;--tx:#e8f0e6;--mu:#9fb0a0;--ac:#58b97a;--bd:#2d3d31;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 16px;background:var(--ac);color:#fff;font-weight:700;letter-spacing:.06em;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
#bk{border:0;background:none;color:#fff;font-size:22px;padding:0 6px;display:none}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
input,select,button.b{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:4px 0}
button.b{background:var(--ac);color:#fff;border:0;font-weight:600}
a{color:var(--ac);word-break:break-word}.mu{color:var(--mu)}.sci{font-style:italic;color:var(--mu);font-size:14px}
.row{display:flex;gap:6px}.row button{flex:1}audio{width:100%;margin-top:6px}h2{margin:6px 0}
.topic{display:flex;gap:14px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--bd)}.topic .ic{font-size:30px;width:40px;text-align:center}
.x{float:right;border:0;background:none;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto}.chip{flex:0 0 auto;min-width:54px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px;font:inherit}.chip.on{background:var(--ac);color:#fff}.cols{display:flex;gap:8px}.cols>div{flex:1;text-align:center}.pl{color:#2a7fd0}.bj{color:#d33}.big{font-size:22px;font-weight:700}</style></head><body>
<header><button id="bk" onclick="tab='home';q='';render()">←</button><span id="ttl">Pajareo Huelva</span></header>
<main id="m"></main>
<script>
const TABS=[["amigos","🌐","Redes Sociales","Amigos y sus enlaces"],["aves","🎵","Sonidos de aves","Lista alfabética con reproductor"],["tiempo","⚡","El tiempo","Previsión por localidad"],["mareas","🌊","Tablas de mareas","Mareas de Huelva"],["sitios","👀","Localizaciones","Dónde hemos visto cada especie"]];
const LOCS=["Huelva","Almonte","El Rocío","Doñana","Isla Cristina","Ayamonte","Punta Umbría","Matalascañas","Moguer","Lepe","Cartaya","El Portil"];
const FR=[["Cristóbal Crespo","https://www.instagram.com/cristobal_crespo_caro"],["Carlos Salguero","https://www.instagram.com/carlxsh"],["Tomás Gómez","https://www.instagram.com/toromy75"],["Fco. Rivas","https://www.instagram.com/francisco_rivas68"],["David (Zuma)","https://www.instagram.com/elzuma"],["Juanjo Cipriano","https://ebird.org/profile/OTEwMTk0/ES"],["Jose Manuel Reyes","https://www.instagram.com/josemreyesp"],["Seba","https://www.instagram.com/seba_wildlife"],["Jose Antonio (jolunepa)","https://www.instagram.com/jolunepa"],["Antonio Medina","https://www.instagram.com/antonio.jmedina"],["Loren","https://www.instagram.com/fotografiasdeloren"],["Felipe","https://www.instagram.com/felipe.felipe.1806"],["Isidro","https://www.instagram.com/donanaparadise"],["Enrique Pragom","https://www.instagram.com/enri_prax"],["Jose A. Diaz","https://www.instagram.com/diazregodon"],["Jose Luis","https://www.facebook.com/joseluis.cruzadoblanco"],["Feliciano","https://www.instagram.com/feliciano.esteban.9"],["Diego","https://www.instagram.com/spanishwildlife70"]];
const SI=[["Camachuelo común","https://maps.app.goo.gl/Rh3Kthsp6KQoRNQ87"],["Camachuelo común","https://maps.app.goo.gl/Kh3F2EJNKzbcijPk9"],["Pechiazul","https://maps.app.goo.gl/xkopK4rHkDf1pMmh7"],["Búho campestre","https://maps.app.goo.gl/tkmkyvNb69Ak8EhGA"],["Chorlito gris","https://maps.app.goo.gl/qxTrqNCbBqarAwAcA"],["Malvasía cabeciblanca","https://maps.app.goo.gl/uGRr4QxcVu7taz7J7"],["Falaropo tricolor","https://maps.app.goo.gl/bLWZuV7Bf7KAjpb9A"]];
const mk=a=>a.map(([name,url])=>({name,url}));
let S;try{S=JSON.parse(localStorage.getItem("ph"))}catch(e){}
if(!S)S={friends:mk(FR),sights:mk(SI)};
const keep=()=>{try{localStorage.setItem("ph",JSON.stringify(S))}catch(e){}};
let tab="home",q="",LIB=[];const URLS={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe=u=>{u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{return new URL(u).href}catch(e){return""}};
const corto=u=>{try{const x=new URL(u);const h=x.hostname.replace("www.","");const p=x.pathname.split("/").filter(Boolean)[0]||"";if(h.includes("instagram.com"))return "Instagram @"+p;if(h.includes("facebook.com"))return "Facebook";if(h.includes("ebird.org"))return "eBird";return h}catch(e){return u}};
window.go=u=>window.open(u,"_blank");
window.add=(k,f)=>{const o={};for(const el of f.querySelectorAll("[name]"))o[el.name]=el.value.trim();if(!o.name)return;S[k].push(o);keep();render()};
window.rm=(k,i)=>{if(confirm("¿Borrar?")){S[k].splice(i,1);keep();render()}};
function render(){
  const cur=TABS.find(t=>t[0]===tab);
  $("#bk").style.display=cur?"block":"none";$("#ttl").textContent=cur?cur[2]:"Pajareo Huelva";
  $("#m").innerHTML=cur?({amigos,aves,tiempo,mareas,sitios})[tab]():home();
}
function home(){return TABS.map(t=>`<div class="topic" onclick="tab='${t[0]}';q='';render()"><span class="ic">${t[1]}</span><div><b>${t[2]}</b><br><small class="mu">${t[3]}</small></div></div>`).join("")}
function lista(k,tit,ph1,ph2,btn,lbl){
  const l=S[k].map((f,i)=>({...f,i}));if(k==="friends")l.sort((a,b)=>a.name.localeCompare(b.name,"es"));
  return `<h2>${tit}</h2>`+l.map(f=>{const u=safe(f.url);return `<div class="card"><b>${esc(f.name)}</b><button class="x" onclick="rm('${k}',${f.i})">🗑</button><br>${u?`<a href="${esc(u)}" target="_blank">${k==="sights"?"Ver localización":esc(corto(u))}</a>`:""}</div>`}).join("")+
  `<form class="card" onsubmit="add('${k}',this);return false"><b>${lbl}</b><input name="name" placeholder="${ph1}"><input name="url" placeholder="${ph2}"><button class="b">${btn}</button></form>`;
}
function amigos(){return lista("friends","Amigos y redes","Nombre","Enlace (Instagram, web...)","Añadir","Añadir amigo")}
function sitios(){return lista("sights","Avistamientos","Especie","Enlace del lugar (Google Maps...)","Guardar","Nuevo avistamiento")}
function tiempo(){return `<h2>El tiempo</h2><div class="card"><select id="loc">${LOCS.map(x=>`<option>${x}</option>`).join("")}</select><button class="b" onclick="go('https://www.google.com/search?q=tiempo+'+encodeURIComponent($('#loc').value))">Ver el tiempo</button><button class="b" onclick="go('https://www.aemet.es/es/eltiempo/prediccion/municipios')">AEMET (oficial)</button></div>`}
const MD={"2026-11-1":["7:52","18:30",47,"0:52 -0.6 7:49 0.8 13:57 -0.7 20:42 0.6"],"2026-11-2":["7:53","18:29",50,"2:20 -0.5 9:13 0.7 15:33 -0.6 22:10 0.6"],"2026-11-3":["7:54","18:28",58,"3:54 -0.5 10:37 0.8 16:52 -0.7 23:23 0.7"],"2026-11-4":["7:55","18:27",67,"5:06 -0.6 11:45 0.9 17:50 -0.8"],"2026-11-5":["7:56","18:26",75,"0:19 0.8 6:01 -0.7 12:39 1.0 18:34 -0.9"],"2026-11-6":["7:57","18:25",81,"1:05 0.9 6:45 -0.9 13:24 1.0 19:12 -0.9"],"2026-11-7":["7:58","18:24",84,"1:45 1.0 7:24 -0.9 14:04 1.1 19:45 -1.0"],"2026-11-8":["7:59","18:23",84,"2:22 1.1 8:00 -1.0 14:41 1.1 20:17 -1.0"],"2026-11-9":["8:00","18:22",82,"2:56 1.1 8:35 -1.0 15:17 1.1 20:49 -1.0"],"2026-11-10":["8:01","18:21",77,"3:30 1.1 9:09 -1.0 15:51 1.0 21:21 -1.0"],"2026-11-11":["8:02","18:20",71,"4:03 1.1 9:43 -1.0 16:24 0.9 21:54 -0.9"],"2026-11-12":["8:03","18:20",64,"4:36 1.0 10:18 -0.9 16:58 0.8 22:27 -0.8"],"2026-11-13":["8:04","18:19",55,"5:10 0.9 10:55 -0.8 17:33 0.7 23:03 -0.7"],"2026-11-14":["8:05","18:18",47,"5:47 0.8 11:35 -0.7 18:11 0.6 23:44 -0.6"],"2026-11-15":["8:06","18:17",40,"6:29 0.7 12:23 -0.6 18:58 0.4"],"2026-11-16":["8:07","18:17",37,"0:34 -0.4 7:21 0.6 13:24 -0.5 20:00 0.4"],"2026-11-17":["8:08","18:16",38,"1:43 -0.4 8:26 0.5 14:39 -0.4 21:21 0.4"],"2026-11-18":["8:09","18:15",45,"3:04 -0.4 9:42 0.5 15:54 -0.5 22:37 0.4"],"2026-11-19":["8:10","18:15",55,"4:17 -0.4 10:53 0.6 16:55 -0.6 23:35 0.6"],"2026-11-20":["8:11","18:14",66,"5:15 -0.6 11:50 0.7 17:45 -0.7"],"2026-11-21":["8:13","18:14",77,"0:22 0.7 6:03 -0.7 12:38 0.9 18:28 -0.9"],"2026-11-22":["8:14","18:13",86,"1:05 0.9 6:46 -0.9 13:23 1.0 19:08 -1.0"],"2026-11-23":["8:15","18:13",92,"1:47 1.1 7:29 -1.1 14:07 1.1 19:49 -1.1"],"2026-11-24":["8:16","18:12",95,"2:29 1.2 8:12 -1.2 14:52 1.2 20:30 -1.2"],"2026-11-25":["8:17","18:12",94,"3:13 1.3 8:58 -1.3 15:40 1.2 21:14 -1.2"],"2026-11-26":["8:18","18:12",89,"3:59 1.3 9:45 -1.3 16:29 1.2 22:00 -1.1"],"2026-11-27":["8:19","18:11",81,"4:48 1.3 10:36 -1.2 17:21 1.0 22:50 -1.0"],"2026-11-28":["8:20","18:11",71,"5:40 1.2 11:31 -1.1 18:15 0.9 23:45 -0.9"],"2026-11-29":["8:20","18:11",63,"6:37 1.1 12:33 -1.0 19:15 0.8"],"2026-11-30":["8:21","18:10",57,"0:46 -0.8 7:39 0.9 13:41 -0.8 20:22 0.6"]};
try{Object.assign(MD,JSON.parse(localStorage.getItem("ph_mareas")||"{}"))}catch(e){}
let mmsg="",mbusy=false;
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function parseMareas(html){
  const t=html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ");
  const now=new Date();let y=now.getFullYear(),m=now.getMonth()+1;
  const mm=t.match(/HUELVA (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre) de (\d{4}) DÍA/i);
  if(mm){m=MESES.indexOf(mm[1].toLowerCase())+1;y=+mm[2]}
  const out={},re=/(?:^|\s)(\d{1,2}) [DLMXJVS] (\d{1,2}:\d{2}) h (\d{1,2}:\d{2}) h((?: \d{1,2}:\d{2} h -?\d+,\d m){2,4}) (\d{2,3}) (?:bajo|medio|alto|muy alto)/g;
  let r;while((r=re.exec(t))){const tides=[...r[4].matchAll(/(\d{1,2}:\d{2}) h (-?\d+,\d) m/g)].map(x=>x[1]+" "+x[2].replace(",",".")).join(" ");out[y+"-"+m+"-"+r[1]]=[r[2],r[3],+r[5],tides]}
  return out;
}
async function refrescar(){
  if(mbusy)return;mbusy=true;mmsg="Actualizando...";render();
  try{
    const r=await fetch("https://tablademareas.com/es/huelva/huelva");
    const n=parseMareas(await r.text()),c=Object.keys(n).length;
    if(c<20)throw new Error("sin datos");
    Object.assign(MD,n);
    let g={};try{g=JSON.parse(localStorage.getItem("ph_mareas")||"{}")}catch(e){}
    Object.assign(g,n);localStorage.setItem("ph_mareas",JSON.stringify(g));
    mmsg="Actualizado: "+c+" días cargados de la web.";
  }catch(e){mmsg="No he podido actualizar. Comprueba que tienes internet y vuelve a intentarlo."}
  mbusy=false;render();
}
const DOW=["dom","lun","mar","mié","jue","vie","sáb"];let mdia=0;
const dkey=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const hm=n=>String(n).replace(".",",")+" m";
function dayTides(d){const e=MD[dkey(d)];if(!e)return null;const a=e[3].split(" "),t=[];for(let i=0;i<a.length;i+=2){const p=a[i].split(":");t.push({d:new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]),h:parseFloat(a[i+1]),r:a[i+1],txt:a[i]})}return t}
function coefTxt(c){return c<45?"bajo":c<70?"medio":c<90?"alto":"muy alto"}
function estado(now){const all=[-1,0,1].flatMap(o=>dayTides(new Date(now.getFullYear(),now.getMonth(),now.getDate()+o))||[]);const nx=all.find(x=>x.d>now);if(!nx)return"";const m=Math.round((nx.d-now)/60000),H=Math.floor(m/60),M=m%60;return `<div class="card"><i>El nivel del agua está <b class="${nx.h>0?"pl":"bj"}">${nx.h>0?"subiendo":"bajando"}</b>. La <b>${nx.h>0?"pleamar":"bajamar"}</b> será dentro de <b>${H} ${H===1?"hora":"horas"} y ${M} minutos</b>.</i></div>`}
window.setM=i=>{mdia=i;render()};
function mareas(){
  const now=new Date(),base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const chips=[0,1,2,3,4,5].map(i=>{const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i);return `<button class="chip ${i===mdia?"on":""}" onclick="setM(${i})">${i?DOW[d.getDay()]:"hoy"}<br><b>${d.getDate()}</b></button>`}).join("");
  const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+mdia),t=dayTides(d),e=MD[dkey(d)];
  const fecha=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  let body;
  if(!t){body=`<div class="card mu">Todavía no tengo los datos de este día. Míralo en la web con el botón de abajo.</div>`}
  else{
    const col=(tit,cls,l)=>`<div><div class="${cls}">${tit}</div>${l.map(x=>`<div class="big ${cls}">${x.txt} h</div><small class="mu">${hm(x.r)}</small>`).join("<br>")}</div>`;
    body=`<div class="card cols">${col("pleamar","pl",t.filter(x=>x.h>0))}${col("bajamar","bj",t.filter(x=>x.h<=0))}</div>`+(mdia===0?estado(now):"")+
    `<div class="card">Amanece a las <b>${e[0]} h</b> y el sol se pone a las <b>${e[1]} h</b>.<br>Coeficiente de mareas: <b>${e[2]}</b> (${coefTxt(e[2])}).</div>`;
  }
  return `<h2>Huelva</h2><div class="chips">${chips}</div><p class="mu" style="margin:8px 2px">${fecha}</p>${body}<button class="b" onclick="refrescar()">🔄 Actualizar mareas</button><small class="mu">${mmsg}</small><button class="b" onclick="go('https://tablademareas.com/es/huelva/huelva')">Ver en tablademareas.com</button><small class="mu">Datos de tablademareas.com. Solo orientativo, no válido para navegación.</small>`;
}
const IDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("pajareo",1);r.onupgradeneeded=()=>r.result.createObjectStore("a",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function loadLib(){try{const d=await IDB();LIB=await new Promise((res,rej)=>{const r=d.transaction("a").objectStore("a").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){LIB=[]}render()}
async function saveFiles(files){try{const d=await IDB();const tx=d.transaction("a","readwrite");const s=tx.objectStore("a");for(const f of files){const base=f.name.replace(/\.[^.]+$/,"");const p=base.split(/\s+[-–_]\s+/);s.put({id:f.name,name:(p[0]||base).trim(),sci:(p[1]||"").trim(),file:f})}await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){alert("No se pudieron guardar los audios.")}loadLib()}
const au=b=>URLS[b.id]||(URLS[b.id]=URL.createObjectURL(b.file));
window.loopT=b=>{const a=b.closest(".card").querySelector("audio");a.loop=!a.loop;b.textContent="🔁 Bucle: "+(a.loop?"sí":"no")};
window.stopA=b=>{const a=b.closest(".card").querySelector("audio");a.pause();a.currentTime=0};
function aves(){
  const n=q.toLowerCase();
  const l=LIB.filter(b=>b.name.toLowerCase().includes(n)).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  return `<h2>Sonidos de aves</h2><input type="file" id="fl" accept="audio/*" multiple style="display:none" onchange="saveFiles([...this.files])"><button class="b" onclick="$('#fl').click()">📂 Cargar carpeta SONIDOS AVES</button><small class="mu">Entra en la carpeta, selecciona todos los audios y acepta. ${LIB.length} audios guardados.</small><input id="sq" placeholder="Buscar por nombre común" value="${esc(q)}" oninput="q=this.value;render();const i=$('#sq');i.focus();i.setSelectionRange(q.length,q.length)">`+
  (l.map(b=>`<div class="card"><b>${esc(b.name)}</b><div class="sci">${esc(b.sci)}</div><audio controls preload="none" src="${au(b)}"></audio><div class="row"><button class="b" onclick="loopT(this)">🔁 Bucle: no</button><button class="b" onclick="stopA(this)">⏹ Stop</button></div></div>`).join("")||`<p class="mu">Todavía no hay audios. Pulsa el botón de arriba.</p>`);
}
loadLib();
</script></body></html>
